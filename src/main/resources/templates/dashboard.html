<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>School Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">
        🎓 School Management Dashboard
    </h1>

    <div class="row">

        <!-- STUDENT CARD -->
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">
                <h3>Total Students</h3>
                <h1 th:text="${studentCount}">0</h1>

                <a href="/students/list"
                   class="btn btn-primary mt-3">
                    Manage Students
                </a>
                <a href="/students/add" class="btn btn-outline-primary mt-2">
                    ➕ Add Student
                </a>
            </div>
        </div>

        <!-- COURSE CARD -->
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">
                <h3>Total Courses</h3>
                <h1 th:text="${courseCount}">0</h1>

                <a href="/courses/list"
                   class="btn btn-success mt-3">
                    Manage Courses
                </a>
                <a href="/courses/add" class="btn btn-outline-success mt-2">
                    ➕ Add Course
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
