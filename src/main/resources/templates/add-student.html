<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Add / Edit Student</h2>

    <form th:action="@{/students/save}"
          th:object="${student}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <!-- NAME -->
        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <!-- EMAIL -->
        <div class="mb-3">
            <label>Email</label>
            <input type="text" class="form-control" th:field="*{email}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"></div>
        </div>

        <!-- PHONE -->
        <div class="mb-3">
            <label>Phone</label>
            <input type="text" class="form-control" th:field="*{phone}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}"></div>
        </div>

        <!-- COURSE -->
        <div class="mb-3">
            <label>Course</label>
            <select class="form-select" name="courseId">
                <option value="">-- Select Course --</option>
                <option th:each="course : ${courses}"
                        th:value="${course.id}"
                        th:text="${course.courseName}"
                        th:selected="${student.course != null and student.course.id == course.id}">
                </option>
            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('course')}"
                 th:errors="*{course}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/students/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>

</body>
</html>
