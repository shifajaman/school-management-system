<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4"
            th:text="${student.id != null} ? 'Edit Student' : 'Add Student'">
        </h2>

        <form th:action="@{/students/save}"
              method="post"
              th:object="${student}">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Student Name</label>

                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>

                <input type="text"
                       th:field="*{phone}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>

                <select name="courseId"
                        class="form-select"
                        required>

                    <option value="">-- Select Course --</option>

                    <option th:each="c : ${courses}"
                            th:value="${c.id}"
                            th:text="${c.courseName}"
                            th:selected="${student.course != null and student.course.id == c.id}">
                    </option>

                </select>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Save Student
            </button>

            <a href="/students/list"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
